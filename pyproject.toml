[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "verified-tcell-perturbseq-triage"
version = "0.2.0"
description = "Reproducible triage of the official primary-human CD4+ T-cell Perturb-seq screen"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Hackathon learning project" }]
dependencies = [
  "anndata>=0.11,<0.13",
  "h5py>=3.12,<4",
  "igraph>=0.11,<2",
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.3,<5",
  "leidenalg>=0.10,<0.12",
  "matplotlib>=3.9,<4",
  "nbclient>=0.10,<0.11",
  "nbformat>=5.10,<6",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydeseq2>=0.5,<0.6",
  "pyyaml>=6.0,<7",
  "scanpy>=1.11,<1.13",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<0.14",
  "tabulate>=0.9,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
tcell-triage = "tcell_exhaustion.cli:main"
perturbseq-triage = "tcell_perturbseq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tcell_exhaustion", "src/tcell_perturbseq"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: end-to-end tests that run the Scanpy workflow",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_tutorial_notebook.py" = ["E501"]
"scripts/build_official_notebook.py" = ["E501"]
